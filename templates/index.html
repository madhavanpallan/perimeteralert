<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arduino Uno Q Interactive Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js"></script>
    <style>
        body {
            background-color: #00796B;
            font-family: Arial, sans-serif;
            color: #FFFFFF;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .banner {
            background-color: #FF9800;
            color: #000;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .metric-box {
            background-color: #333333;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 28px;
            font-weight: bold;
            color: #FFB74D;
            margin-right: 10px;
        }
        .metric-container {
            margin: 15px 0;
            font-size: 24px;
            font-weight: bold;
        }
        .control-panel {
            background-color: #004D40;
            border-radius: 8px;
            padding: 20px;
            max-width: 500px;
            margin: 30px auto;
            text-align: left;
        }
        .control-btn {
            background-color: #FF9800;
            border: none;
            color: #000;
            padding: 12px;
            width: 80%;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .status-indicator {
            height: 20px;
            width: 20px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
            float: right;
        }
        .status-indicator.active {
            background-color: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
        }
    </style>
</head>
<body>

    <div class="banner">Interactive Linux MPU Mode Active (Connected to Arduino UNO Q)</div>

    <div class="metric-container">
        <span class="metric-box" id="humidity">--.-</span> % humidity
    </div>

    <div class="metric-container">
        <span class="metric-box" id="temperature">--.-</span> Celsius
    </div>

    <div class="control-panel">
        <h3>Remote Hardware Control</h3>
        <hr style="border: 0; border-top: 1px solid #00796B;">
        <br>
        <button class="control-btn" onclick="toggleActuator()">Toggle Actuator / Cooling Fan</button>
        <span id="ledStatus" class="status-indicator"></span>
    </div>

    <script>
        const socket = io();

        // Listen for real-time sensor data updates from Python backend
        socket.on('update_sensors', function(data) {
            document.getElementById('humidity').innerText = data.humidity;
            document.getElementById('temperature').innerText = data.temperature;
        });

        function toggleActuator() {
            fetch('/toggle', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    const indicator = document.getElementById('ledStatus');
                    if (data.status === "ON") {
                        indicator.classList.add('active');
                    } else {
                        indicator.classList.remove('active');
                    }
                });
        }
    </script>
</body>
</html>
